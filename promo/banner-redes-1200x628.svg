<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="628" viewBox="0 0 1200 628">
  <title>Float Gardens: La Conquista del Café — Farmea café, gana puntos, toma café gratis</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#145a40"/>
      <stop offset="1" stop-color="#082419"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cc4ec"/>
      <stop offset="1" stop-color="#2b8fc0"/>
    </linearGradient>
    <symbol id="cherry" viewBox="-22 -26 44 44" overflow="visible">
      <path d="M-6 2 Q-3 -12 4 -16 M7 4 Q6 -8 4 -16" stroke="#2a7a41" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="11" cy="-15" rx="8" ry="4" fill="#3fa35b" transform="rotate(-20 11 -15)"/>
      <circle cx="-6" cy="6" r="8" fill="#d6423a"/>
      <circle cx="8" cy="8" r="8" fill="#d6423a"/>
      <circle cx="-8.5" cy="3.5" r="2.4" fill="#fff" opacity="0.7"/>
      <circle cx="5.5" cy="5.5" r="2.4" fill="#fff" opacity="0.7"/>
    </symbol>
    <symbol id="plant" viewBox="-60 -90 120 110" overflow="visible">
      <ellipse cx="0" cy="8" rx="56" ry="17" fill="#000" opacity="0.15"/>
      <ellipse cx="0" cy="3" rx="56" ry="17" fill="#f2f2ee"/>
      <ellipse cx="0" cy="0" rx="20" ry="7" fill="#2d2d2d"/>
      <path d="M0 0 L0 -50" stroke="#2a7a41" stroke-width="5"/>
      <g fill="#3fa35b">
        <ellipse cx="-24" cy="-40" rx="20" ry="9" transform="rotate(-25 -24 -40)"/>
        <ellipse cx="24" cy="-40" rx="20" ry="9" transform="rotate(25 24 -40)"/>
        <ellipse cx="-20" cy="-60" rx="18" ry="8" fill="#2a7a41" transform="rotate(-40 -20 -60)"/>
        <ellipse cx="20" cy="-60" rx="18" ry="8" fill="#2a7a41" transform="rotate(40 20 -60)"/>
        <ellipse cx="0" cy="-66" rx="16" ry="12"/>
      </g>
      <g fill="#d6423a">
        <circle cx="-14" cy="-48" r="6"/><circle cx="-4" cy="-44" r="6"/><circle cx="10" cy="-50" r="6"/>
        <circle cx="18" cy="-42" r="6"/><circle cx="-20" cy="-58" r="6"/><circle cx="4" cy="-60" r="6"/>
      </g>
      <g fill="#fff" opacity="0.7">
        <circle cx="-16" cy="-50" r="1.8"/><circle cx="8" cy="-52" r="1.8"/><circle cx="2" cy="-62" r="1.8"/>
      </g>
    </symbol>
    <symbol id="aeropress" viewBox="-20 -60 40 70" overflow="visible">
      <rect x="-18" y="-4" width="36" height="16" rx="5" fill="#f5f5f5"/>
      <rect x="-12" y="-44" width="24" height="42" rx="3" fill="#cfe2ee" opacity="0.95"/>
      <rect x="-10" y="-26" width="20" height="22" fill="#4a2c1d"/>
      <rect x="-10" y="-58" width="20" height="18" rx="3" fill="#444"/>
      <rect x="-16" y="-62" width="32" height="6" rx="2" fill="#222"/>
    </symbol>
    <symbol id="barista" viewBox="-60 -150 120 160" overflow="visible">
      <ellipse cx="0" cy="0" rx="40" ry="12" fill="#000" opacity="0.25"/>
      <rect x="-22" y="-48" width="17" height="48" rx="5" fill="#33302c"/>
      <rect x="5" y="-48" width="17" height="48" rx="5" fill="#33302c"/>
      <rect x="-36" y="-110" width="72" height="68" rx="18" fill="#f5f1e8"/>
      <rect x="-26" y="-94" width="52" height="58" rx="8" fill="#0f3d2e"/>
      <ellipse cx="0" cy="-70" rx="10" ry="6" fill="#bff0cf"/>
      <rect x="-50" y="-104" width="16" height="46" rx="8" fill="#f5f1e8"/>
      <rect x="34" y="-120" width="16" height="44" rx="8" fill="#f5f1e8" transform="rotate(-35 42 -98)"/>
      <circle cx="-42" cy="-56" r="9" fill="#e0ac7e"/>
      <circle cx="0" cy="-130" r="30" fill="#e0ac7e"/>
      <path d="M-30 -136 A30 30 0 0 1 30 -136 Z" fill="#2a1a10"/>
      <path d="M-29 -142 A29 26 0 0 1 29 -142 Z" fill="#2fbf71"/>
      <rect x="10" y="-146" width="40" height="8" rx="3" fill="#2fbf71"/>
      <circle cx="-10" cy="-128" r="4" fill="#222"/>
      <circle cx="10" cy="-128" r="4" fill="#222"/>
      <path d="M-10 -114 Q0 -106 10 -114" stroke="#7a3b2a" stroke-width="3" fill="none" stroke-linecap="round"/>
    </symbol>
    <symbol id="inspector" viewBox="-40 -120 80 130" overflow="visible">
      <ellipse cx="0" cy="0" rx="28" ry="8" fill="#000" opacity="0.25"/>
      <rect x="-16" y="-36" width="12" height="36" rx="4" fill="#3a3c42"/>
      <rect x="4" y="-36" width="12" height="36" rx="4" fill="#3a3c42"/>
      <rect x="-26" y="-84" width="52" height="52" rx="12" fill="#6d7078"/>
      <path d="M-4 -82 L4 -82 L6 -56 L0 -50 L-6 -56 Z" fill="#c0392b"/>
      <circle cx="14" cy="-70" r="5" fill="#e6c34a"/>
      <circle cx="0" cy="-98" r="22" fill="#e0ac7e"/>
      <ellipse cx="0" cy="-112" rx="34" ry="8" fill="#2b2b30"/>
      <rect x="-20" y="-134" width="40" height="24" rx="8" fill="#2b2b30"/>
      <rect x="-20" y="-118" width="40" height="5" fill="#c0392b"/>
      <path d="M-14 -104 L-5 -100 M14 -104 L5 -100" stroke="#222" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-8" cy="-96" r="3" fill="#222"/><circle cx="8" cy="-96" r="3" fill="#222"/>
      <ellipse cx="0" cy="-86" rx="7" ry="5" fill="#7a3b2a"/>
    </symbol>
    <symbol id="splash" viewBox="-30 -30 60 60" overflow="visible">
      <ellipse cx="0" cy="0" rx="20" ry="12" fill="#6b3b1f"/>
      <circle cx="-22" cy="-8" r="6" fill="#6b3b1f"/>
      <circle cx="20" cy="-12" r="5" fill="#6b3b1f"/>
      <circle cx="14" cy="12" r="4" fill="#6b3b1f"/>
      <ellipse cx="-4" cy="-4" rx="7" ry="4" fill="#ffe6c8" opacity="0.6"/>
    </symbol>
  </defs>

  <rect width="1200" height="628" fill="url(#bg)"/>
  <!-- rejilla del invernadero -->
  <g stroke="#2fbf71" stroke-opacity="0.08" stroke-width="2">
    <path d="M0 100 H1200 M0 220 H1200 M0 340 H1200 M0 460 H1200 M0 580 H1200"/>
    <path d="M100 0 V628 M260 0 V628 M420 0 V628 M580 0 V628 M740 0 V628 M900 0 V628 M1060 0 V628"/>
  </g>

  <!-- Lado derecho: invernadero flotante + barista -->
  <path d="M640 628 V450 Q700 425 760 445 T880 445 T1000 445 T1120 445 T1200 440 V628 Z" fill="url(#water)"/>
  <g stroke="#fff" stroke-opacity="0.35" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M670 470 q12 -8 24 0 M820 500 q12 -8 24 0 M980 470 q12 -8 24 0 M1120 520 q12 -8 24 0 M720 580 q12 -8 24 0 M900 590 q12 -8 24 0"/>
  </g>
  <use href="#plant" xlink:href="#plant" x="660" y="370" width="150" height="137"/>
  <use href="#plant" xlink:href="#plant" x="1030" y="390" width="150" height="137"/>
  <use href="#barista" xlink:href="#barista" x="760" y="150" width="270" height="360"/>
  <use href="#aeropress" xlink:href="#aeropress" x="955" y="175" width="70" height="122"/>
  <!-- chorro de café a presión contra el inspector -->
  <path d="M1000 210 Q1080 160 1120 120" stroke="#6b3b1f" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="2 22"/>
  <use href="#splash" xlink:href="#splash" x="1100" y="80" width="70" height="70"/>
  <g transform="translate(1140 210) rotate(14)" opacity="0.95">
    <use href="#inspector" xlink:href="#inspector" x="-45" y="-140" width="90" height="146"/>
  </g>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-weight="800">
    <g transform="translate(700 120) rotate(-8)">
      <rect x="-48" y="-24" width="96" height="44" rx="22" fill="#9fe8bf"/>
      <text x="0" y="8" text-anchor="middle" font-size="24" fill="#0f3d2e">+10 ★</text>
    </g>
    <g transform="translate(1080 330) rotate(6)">
      <rect x="-48" y="-24" width="96" height="44" rx="22" fill="#ffe08a"/>
      <text x="0" y="8" text-anchor="middle" font-size="24" fill="#4a2c1d">+3 🍒</text>
    </g>
  </g>
  <use href="#cherry" xlink:href="#cherry" x="620" y="230" width="60" height="60"/>
  <use href="#cherry" xlink:href="#cherry" x="1110" y="420" width="50" height="50"/>

  <!-- Lado izquierdo: mensaje -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="60" y="78" font-size="26" font-weight="800" fill="#2fbf71" letter-spacing="6">FLOAT GARDENS</text>
    <rect x="60" y="94" width="268" height="34" rx="17" fill="#d6423a"/>
    <text x="194" y="118" text-anchor="middle" font-size="18" font-weight="800" fill="#fff3dc" letter-spacing="1">LA CONQUISTA DEL CAFÉ</text>

    <text x="56" y="222" font-size="84" font-weight="900" fill="#fff3dc">¡FARMEA</text>
    <text x="56" y="306" font-size="84" font-weight="900" fill="#fff3dc">CAFÉ!</text>
    <text x="60" y="360" font-size="28" font-weight="600" fill="#fff3dc">Cosecha, prensa y vende café hidropónico.</text>
    <text x="60" y="400" font-size="28" font-weight="600" fill="#fff3dc">Gana <tspan fill="#9fe8bf" font-weight="800">Puntos Float</tspan> y tómate un</text>
    <text x="60" y="446" font-size="40" font-weight="900" fill="#ffe08a">CAFÉ GRATIS ☕</text>

    <rect x="60" y="480" width="300" height="70" rx="35" fill="#2fbf71"/>
    <text x="210" y="525" text-anchor="middle" font-size="30" font-weight="900" fill="#082419">▶ JUEGA GRATIS</text>
    <text x="60" y="594" font-size="17" fill="#fff3dc" opacity="0.8">Canjea tus puntos en los puntos oficiales de Float Gardens · Bogotá</text>
  </g>
</svg>
