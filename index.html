<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Float Gardens: Bogotá</title>
  <meta name="description" content="Shooter de mundo abierto en tercera persona inspirado en Bogotá: farmea café hidropónico, conquista barrios y gana Puntos Float para tomar café gratis en Float Gardens.">
  <meta name="theme-color" content="#c9cfcb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta property="og:title" content="Float Gardens: La Conquista del Café — Bogotá mundo abierto">
  <meta property="og:description" content="Farmea café, conquista Bogotá y tómate un café gratis en Float Gardens.">
  <meta property="og:image" content="promo/banner-redes-1200x628.svg">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="css/world.css">
  <link rel="stylesheet" href="css/glass.css">
</head>
<body>
  <canvas id="world" aria-label="Float Gardens: Bogotá"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-tl">
      <div class="minimap-wrap"><canvas id="minimap" width="170" height="170"></canvas></div>
      <div class="location"><b id="locDistrict"></b><span id="locStreet"></span></div>
    </div>
    <div class="hud-tc">
      <canvas id="compass" width="360" height="34"></canvas>
      <div class="objective"><b id="objTitle"></b><span id="objSub"></span></div>
      <div id="capture" class="capture hidden"><div id="capName"></div><div class="bar"><i id="capFill"></i></div></div>
      <div id="bossbar" class="bossbar hidden"><div>☠ DON MONOPOLIO</div><div class="bar"><i id="bossFill"></i></div></div>
      <div id="toast" class="toast"></div>
    </div>
    <div class="hud-tr">
      <div class="wallet"><span id="wMoney"></span><span id="wPoints"></span></div>
      <div id="killfeed"></div>
    </div>
    <div class="hud-bl">
      <div class="hp-card">
        <div class="player-tag">Vida · Barista <small>FLOAT GARDENS</small></div>
        <div class="hp"><div class="hp-bar"><i id="hpFill"></i></div><b id="hpText">100</b></div>
        <div class="cherry-count"><small>Cerezas</small> <b id="cherries">0</b></div>
      </div>
    </div>
    <div class="hud-br">
      <div class="weapon">
        <div class="w-name">AeroPress X-1 · carga</div>
        <div class="w-ammo"><b id="ammo">12</b><span id="ammoMax">/ 12</span></div>
        <div id="reloadBar" class="reload hidden"><i></i><span>PRENSANDO...</span></div>
      </div>
    </div>
    <div id="crosshair"><i></i><i></i><i></i><i></i></div>
    <div id="hitmarker"></div>
    <div id="prompt" class="prompt hidden"></div>
    <div id="banner" class="banner"></div>
    <div id="numbers"></div>
    <div class="bigmap hidden"><canvas id="bigmap"></canvas><div class="bigmap-hint">M / 🗺 para cerrar</div></div>
  </div>
  <div id="vignette"></div>
  <div id="lowhp"></div>

  <div id="touch">
    <div id="lookArea"></div>
    <div id="stick"><div id="knob"></div></div>
    <button id="tFire" class="tb fire">💥</button>
    <button id="tAim" class="tb aim">🎯</button>
    <button id="tJump" class="tb jump">⤒</button>
    <button id="tReload" class="tb reload">↻</button>
    <button id="tAction" class="tb action">E</button>
    <button id="tMap" class="tb small map">🗺</button>
    <button id="tPause" class="tb small pause">❚❚</button>
  </div>

  <div id="menu" class="menu hidden"></div>
  <div id="loading">Cargando Bogotá...</div>

  <script src="vendor/three.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js3d/config.js"></script>
  <script src="js3d/textures.js"></script>
  <script src="js3d/world.js"></script>
  <script src="js3d/entities.js"></script>
  <script src="js3d/input.js"></script>
  <script src="js3d/audio.js"></script>
  <script src="js3d/hud.js"></script>
  <script src="js3d/menus.js"></script>
  <script src="js3d/game.js"></script>
  <script>
    if (!window.WebGLRenderingContext) document.getElementById('loading').textContent = 'Tu navegador no soporta WebGL. Prueba el modo clásico: clasico.html';
  </script>
</body>
</html>
